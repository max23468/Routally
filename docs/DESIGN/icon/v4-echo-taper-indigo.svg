<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Routally — L'eco che cresce</title>
  <desc id="desc">L'arco esterno non ha spessore costante: parte sottile esattamente sopra il fianco e si ingrossa fino alla diagonale, dove si ferma. Il progresso si vede accumularsi invece di essere solo presente, e il segno guadagna un verso di lettura che un arco monolineare non ha. Sistema condiviso: contorno esterno ellittico in rapporto 288 a 274 e contatore circolare esatto, per cui il ciclo pesa piu' sui fianchi che sulle curve orizzontali secondo l'asse verticale tipografico; il fianco continua la tangente verticale del ciclo fino alla linea di base 848; gamba rastremata con taglio orizzontale sul piede; terminali degli archi tagliati sui raggi; overshoot ottico di 6 per le forme circolari che appoggiano alla base. Trattamento cromatico: fondo indaco brand, segno chiaro. Livelli per Icon Composer: background, symbol, accent. Esplorazione per il Decision Gate DG-ICON: nessuna scelta definitiva.</desc>
