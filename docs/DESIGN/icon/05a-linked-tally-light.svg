<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Routally — Tally collegati</title>
  <desc id="desc">Alternativa 4.8 n.4 — tally marks collegati. Quattro conteggi e un quinto tratto che, curvandosi, li collega e produce una conseguenza: il tally diventa relazione, non solo somma. Trattamento cromatico: fondo chiaro, segno indaco brand. Livelli per Icon Composer: background, symbol, accent. Esplorazione per il Decision Gate DG-ICON: nessuna scelta definitiva.</desc>
  <g id="background">
    <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
  </g>
  <g id="symbol" fill="none" stroke="#4C46D8" stroke-linecap="round" stroke-linejoin="round" color="#4C46D8">
    <rect x="280" y="296" width="80" height="432" rx="40" fill="currentColor" stroke="none"/>
    <rect x="400" y="296" width="80" height="432" rx="40" fill="currentColor" stroke="none"/>
    <rect x="520" y="296" width="80" height="432" rx="40" fill="currentColor" stroke="none"/>
    <rect x="640" y="296" width="80" height="432" rx="40" fill="currentColor" stroke="none"/>
  </g>
  <g id="accent" fill="none" stroke="#3429BD" stroke-linecap="round" stroke-linejoin="round" color="#3429BD">
    <path d="M 256 340 A 720 720 0 0 1 716 690" stroke-width="80"/>
    <circle cx="800" cy="754" r="48" fill="currentColor" stroke="none"/>
  </g>
</svg>