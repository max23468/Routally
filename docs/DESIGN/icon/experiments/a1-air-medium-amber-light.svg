<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Routally — A1 con accento Amber</title>
  <desc id="desc">L'eco si stacca dalla R di novantadue unita' invece di cinquantasei e ingrossa fino a settantaquattro. La R rimpicciolisce quel tanto che serve a fare posto: nella tela fissa dell'icona, o si allontana l'arco o si tiene grande la lettera, non entrambe. Sistema condiviso: contorno esterno ellittico in rapporto 288 a 274 con contatore circolare esatto, per cui il ciclo pesa piu' sui fianchi che sulle curve orizzontali secondo l'asse verticale tipografico; il fianco continua la tangente verticale del ciclo fino alla linea di base 848; gamba rastremata con taglio orizzontale sul piede; terminali degli archi tagliati sui raggi; overshoot ottico di 6 per le forme circolari che appoggiano alla base; varco della soglia e apertura di un eventuale secondo ciclo sulla diagonale a quarantacinque gradi, mentre l'arco esterno si ferma trenta gradi sopra l'orizzontale. Trattamento cromatico: fondo chiaro, segno indaco brand, spessori pieni. Livelli per Icon Composer: background, symbol, accent. Esplorazione per il Decision Gate DG-ICON: nessuna scelta definitiva. Controllo cromatico per il test cieco: geometria canonica con testa da 50 e token Amber approvati.</desc>
