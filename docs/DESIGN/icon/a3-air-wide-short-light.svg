<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Routally — Aria decisa, arco corto</title>
  <desc id="desc">Stesso distacco della precedente ma l'arco parte piu' in alto, a duecentocinque gradi invece che a centottanta: copre meno lettera, pesa di piu' e lascia respirare il fianco. L'eco smette di scavalcare il segno e diventa un gesto breve. Sistema condiviso: contorno esterno ellittico in rapporto 288 a 274 con contatore circolare esatto, per cui il ciclo pesa piu' sui fianchi che sulle curve orizzontali secondo l'asse verticale tipografico; il fianco continua la tangente verticale del ciclo fino alla linea di base 848; gamba rastremata con taglio orizzontale sul piede; terminali degli archi tagliati sui raggi; overshoot ottico di 6 per le forme circolari che appoggiano alla base; varco, arresto dell'eco e apertura del secondo ciclo cadono tutti sulla stessa diagonale a quarantacinque gradi. Trattamento cromatico: fondo chiaro, segno indaco brand, spessori pieni. Livelli per Icon Composer: background, symbol, accent. Esplorazione per il Decision Gate DG-ICON: nessuna scelta definitiva.</desc>
