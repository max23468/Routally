<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Routally — L'eco che cresce e si chiude</title>
  <desc id="desc">Le due preferite in un solo segno: l'arco cresce lungo il percorso e si chiude in una testa piena sulla diagonale. La rastremazione da' la direzione, la testa da' il punto d'arrivo, e la testa e' dimensionata sulla larghezza finale dell'arco invece che su un valore a se'. Sistema condiviso: contorno esterno ellittico in rapporto 288 a 274 con contatore circolare esatto, per cui il ciclo pesa piu' sui fianchi che sulle curve orizzontali secondo l'asse verticale tipografico; il fianco continua la tangente verticale del ciclo fino alla linea di base 848; gamba rastremata con taglio orizzontale sul piede; terminali degli archi tagliati sui raggi; overshoot ottico di 6 per le forme circolari che appoggiano alla base; varco, arresto dell'eco e apertura del secondo ciclo cadono tutti sulla stessa diagonale a quarantacinque gradi. Trattamento cromatico: fondo indaco brand, segno chiaro, spessori compensati al 97 per cento per l'irradiazione. Livelli per Icon Composer: background, symbol, accent. Esplorazione per il Decision Gate DG-ICON: nessuna scelta definitiva.</desc>
