<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Routally — Aria decisa</title>
  <desc id="desc">Il distacco sale a centoventotto e l'arco arriva a ottantasei: l'eco diventa un elemento autonomo che accompagna la lettera invece di appoggiarvisi. E' la lettura piu' netta e quella che regge meglio alle misure minime, dove un arco sottile e vicino si confonde con il ciclo. Sistema condiviso: contorno esterno ellittico in rapporto 288 a 274 con contatore circolare esatto, per cui il ciclo pesa piu' sui fianchi che sulle curve orizzontali secondo l'asse verticale tipografico; il fianco continua la tangente verticale del ciclo fino alla linea di base 848; gamba rastremata con taglio orizzontale sul piede; terminali degli archi tagliati sui raggi; overshoot ottico di 6 per le forme circolari che appoggiano alla base; varco della soglia e apertura di un eventuale secondo ciclo sulla diagonale a quarantacinque gradi, mentre l'arco esterno si ferma trenta gradi sopra l'orizzontale. Trattamento cromatico: fondo chiaro, segno indaco brand, spessori pieni. Livelli per Icon Composer: background, symbol, accent. Esplorazione per il Decision Gate DG-ICON: nessuna scelta definitiva.</desc>
