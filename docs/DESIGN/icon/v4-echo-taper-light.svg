<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Routally — L'eco che cresce</title>
  <desc id="desc">L'arco esterno parte sottile sopra il fianco e si ingrossa fino alla diagonale, dove si ferma con un taglio radiale. Il progresso si vede accumularsi e il segno guadagna un verso di lettura che un arco monolineare non ha. L'attacco parte da ventiquattro unita' e non da sedici: sotto quella misura spariva a ventinove punti. Sistema condiviso: contorno esterno ellittico in rapporto 288 a 274 con contatore circolare esatto, per cui il ciclo pesa piu' sui fianchi che sulle curve orizzontali secondo l'asse verticale tipografico; il fianco continua la tangente verticale del ciclo fino alla linea di base 848; gamba rastremata con taglio orizzontale sul piede; terminali degli archi tagliati sui raggi; overshoot ottico di 6 per le forme circolari che appoggiano alla base; varco, arresto dell'eco e apertura del secondo ciclo cadono tutti sulla stessa diagonale a quarantacinque gradi. Trattamento cromatico: fondo chiaro, segno indaco brand, spessori pieni. Livelli per Icon Composer: background, symbol, accent. Esplorazione per il Decision Gate DG-ICON: nessuna scelta definitiva.</desc>
