<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Routally — Tally e ciclo</title>
  <desc id="desc">Alternativa 4.8 n.4 — tally marks collegati. I conteggi confluiscono in un ciclo: la quarta asta è sostituita dall'anello che il tally alimenta. Trattamento cromatico: fondo chiaro, segno indaco brand. Livelli per Icon Composer: background, symbol, accent. Esplorazione per il Decision Gate DG-ICON: nessuna scelta definitiva.</desc>
  <g id="background">
    <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
  </g>
  <g id="symbol" fill="none" stroke="#4C46D8" stroke-linecap="round" stroke-linejoin="round" color="#4C46D8">
    <rect x="296" y="340" width="76" height="420" rx="38" fill="currentColor" stroke="none"/>
    <rect x="408" y="340" width="76" height="420" rx="38" fill="currentColor" stroke="none"/>
    <rect x="520" y="340" width="76" height="420" rx="38" fill="currentColor" stroke="none"/>
    <circle cx="700" cy="400" r="110" stroke-width="74"/>
  </g>
  <g id="accent" fill="none" stroke="#3429BD" stroke-linecap="round" stroke-linejoin="round" color="#3429BD">
    <path d="M 258 726 A 640 640 0 0 1 606 494" stroke-width="76"/>
  </g>
</svg>