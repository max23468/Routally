name: Publication status

on:
  workflow_run:
    workflows: ["Publication gate"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    name: Pubblica esito aggregato
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLICATION_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      PUBLICATION_HEAD: ${{ github.event.workflow_run.head_sha }}
      PUBLICATION_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Pubblica lo status sull'HEAD validato
        run: node scripts/publication-status.mjs
