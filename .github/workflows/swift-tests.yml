name: Swift tests

on:
  push:
    branches: [main]
    paths:
      - "**/*.swift"
      - "**/*.xcodeproj/**"
      - "**/Package.swift"
      - "**/Package.resolved"
      - "Configuration/**"
      - ".github/workflows/swift-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.swift"
      - "**/*.xcodeproj/**"
      - "**/Package.swift"
      - "**/Package.resolved"
      - "Configuration/**"
      - ".github/workflows/swift-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Routally Tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select latest iPhone Simulator
        run: |
          set -euo pipefail
          python3 <<'PY' > "$RUNNER_TEMP/routally-destination"
          import json
          import re
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "-j"],
                  text=True,
              )
          )
          candidates = []
          for runtime, devices in payload["devices"].items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if match is None:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))

          if not candidates:
              raise SystemExit("No available iPhone Simulator found")

          version, name, udid = max(candidates)
          print(f"platform=iOS Simulator,id={udid}")
          print(f"Selected {name} on iOS {version[0]}.{version[1]}", file=__import__("sys").stderr)
          PY
          echo "ROUTALLY_TEST_DESTINATION=$(cat "$RUNNER_TEMP/routally-destination")" >> "$GITHUB_ENV"

      - name: Run Routally Tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Routally.xcodeproj \
            -scheme "Routally Dev" \
            -destination "$ROUTALLY_TEST_DESTINATION" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_COMPILE_CACHE=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO
