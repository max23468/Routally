name: CodeQL

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-swift:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepara package graph fuori da CodeQL
        run: >-
          xcodebuild -resolvePackageDependencies
          -project Routally.xcodeproj
          -scheme "Routally Dev"
          -derivedDataPath "$RUNNER_TEMP/RoutallyCodeQLDerivedData"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: swift
          build-mode: manual
      - name: Build Swift
        run: >-
          xcodebuild build
          -project Routally.xcodeproj
          -scheme "Routally Dev"
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath "$RUNNER_TEMP/RoutallyCodeQLDerivedData"
          -disableAutomaticPackageResolution
          -skipPackageUpdates
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=NO
          COMPILATION_CACHE_ENABLE_CACHING=NO
          SWIFT_ENABLE_COMPILE_CACHE=NO
          SWIFT_USE_INTEGRATED_DRIVER=NO
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:swift/scheduled
          output: codeql-results
          upload: never
          upload-database: false
      - name: Conserva il SARIF senza pubblicarlo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-scheduled-sarif-${{ github.run_id }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 1

  upload-sarif:
    name: Upload scheduled SARIF
    needs: analyze-swift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Recupera il SARIF come dato
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codeql-scheduled-sarif-${{ github.run_id }}
          path: codeql-results
      - name: Pubblica il SARIF senza eseguire codice del repository
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: codeql-results
          category: /language:swift/scheduled
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
