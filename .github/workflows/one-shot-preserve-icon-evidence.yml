name: One-shot preserve icon evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.head_ref == 'codex/icon-validation-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Preserve non-generated evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path("scripts/build-icon-review-assets.mjs")
          text = build.read_text()
          old = '''function resetDirectory(path) {
            rmSync(path, { recursive: true, force: true });
            mkdirSync(path, { recursive: true });
          }'''
          new = '''function prepareGeneratedDirectory(path) {
            mkdirSync(path, { recursive: true });
            for (const name of readdirSync(path)) {
              if (name.endsWith(".svg")) rmSync(join(path, name), { force: true });
            }
          }'''
          if old not in text:
              raise SystemExit("resetDirectory non riconosciuta")
          text = text.replace(old, new)
          text = text.replace(
              'for (const path of [COMPOSER_DIR, EXPERIMENT_DIR, EVIDENCE_DIR]) resetDirectory(path);',
              'for (const path of [COMPOSER_DIR, EXPERIMENT_DIR, EVIDENCE_DIR]) prepareGeneratedDirectory(path);',
          )
          build.write_text(text)

          check = Path("scripts/check-icon-review-assets.mjs")
          text = check.read_text()
          old = '''function restore(files) {
            for (const directory of DIRECTORIES) {
              rmSync(join(ICON_DIR, directory), { recursive: true, force: true });
              mkdirSync(join(ICON_DIR, directory), { recursive: true });
            }
            for (const [name, body] of files) writeFileSync(join(ICON_DIR, name), body, "utf8");
          }'''
          new = '''function restore(files) {
            for (const directory of DIRECTORIES) {
              const path = join(ICON_DIR, directory);
              mkdirSync(path, { recursive: true });
              for (const name of readdirSync(path)) {
                if (name.endsWith(".svg")) rmSync(join(path, name), { force: true });
              }
            }
            for (const [name, body] of files) writeFileSync(join(ICON_DIR, name), body, "utf8");
          }'''
          if old not in text:
              raise SystemExit("restore non riconosciuta")
          check.write_text(text.replace(old, new))
          PY

      - name: Validate preservation and icon assets
        run: |
          sentinel="docs/DESIGN/icon/evidence/.preserve-test.txt"
          printf 'non-generated evidence\n' > "$sentinel"
          node scripts/build-icon-review-assets.mjs
          test -f "$sentinel"
          node scripts/check-icon-review-assets.mjs
          test -f "$sentinel"
          rm "$sentinel"
          node scripts/check-icon-assets.mjs
          node scripts/validate-icon-assets.mjs
          node scripts/check-reading-matrix.mjs
          node scripts/check-roadmap-hierarchy.mjs
          git diff --check
          git diff --exit-code -- docs/DESIGN/icon/composer-layers docs/DESIGN/icon/experiments docs/DESIGN/icon/evidence

      - name: Record fix and remove temporary workflow
        env:
          BRANCH: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("docs/DESIGN/icon/one-shot-validation-report.md")
          text = path.read_text()
          marker = "## Limiti\n"
          addition = f'''## Correzione successiva alla review Codex\n\nIl run una tantum `{os.environ["RUN_ID"]}` ha verificato con un file sentinella non SVG che\nil builder e il checker eliminino e ripristinino esclusivamente gli SVG generati. README,\nscreenshot o altre evidenze manuali presenti nelle tre cartelle restano intatti.\n\n'''
          if addition not in text:
              text = text.replace(marker, addition + marker)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/one-shot-preserve-icon-evidence.yml
          git add -- scripts/build-icon-review-assets.mjs scripts/check-icon-review-assets.mjs docs/DESIGN/icon/one-shot-validation-report.md
          git commit -m "fix: preserve non-generated icon evidence"
          git push origin "HEAD:${BRANCH}"
