name: One-shot finalize icon baseline

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'codex/icon-validation-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply approved canonical baseline
        run: |
          python3 scripts/finalize-icon-baseline-once.py prepare
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/DESIGN/icon/README.md")
          text = path.read_text(encoding="utf-8")
          needle = "T1 non è una sostituzione automatica alle piccole dimensioni:"
          replacement = "T1 resta il benchmark della silhouette e non è una sostituzione automatica alle piccole dimensioni:"
          if needle not in text:
              raise SystemExit("Frase T1 non trovata")
          path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
          PY

      - name: Regenerate and validate
        run: |
          node scripts/build-icon-assets.mjs
          node scripts/check-icon-assets.mjs

          sentinel="docs/DESIGN/icon/evidence/.canonicalization-preserve-test.txt"
          printf 'manual evidence must survive\n' > "$sentinel"
          node scripts/build-icon-review-assets.mjs
          test -f "$sentinel"
          node scripts/check-icon-review-assets.mjs
          test -f "$sentinel"
          rm "$sentinel"

          node scripts/validate-icon-assets.mjs | tee /tmp/icon-validation.log
          python3 scripts/finalize-icon-baseline-once.py report \
            --run-id "${{ github.run_id }}" \
            --validation-log /tmp/icon-validation.log

          node scripts/check-reading-matrix.mjs
          node scripts/check-roadmap-hierarchy.mjs
          git diff --check

      - name: Commit final baseline and remove temporary scaffolding
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -- \
            .github/workflows/one-shot-finalize-icon-baseline.yml \
            scripts/finalize-icon-baseline-once.py

          git add -- \
            CHANGELOG.md \
            docs/DECISION_REGISTER.md \
            docs/MASTER_PLAN.md \
            docs/DESIGN/ui-foundation.md \
            docs/DESIGN/icon \
            scripts/build-icon-assets.mjs \
            scripts/build-icon-review-assets.mjs \
            scripts/validate-icon-assets.mjs

          git diff --cached --check
          git commit -m "design: promote A1 Lavender 50 to canonical baseline"
          git push origin "HEAD:${BRANCH}"
