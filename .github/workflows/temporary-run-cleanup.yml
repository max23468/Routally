name: Temporary Run Cleanup

on:
  push:
    branches: [refactor/m01-foundation-stabilization]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete branch runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/runs?branch=${GITHUB_REF_NAME}&per_page=100" \
            --jq '.workflow_runs[] | [.id, .name, .head_sha, .status] | @tsv' |
          while IFS=$'\t' read -r run_id name head_sha status; do
            if [[ "$run_id" == "$GITHUB_RUN_ID" ]]; then
              continue
            fi
            if [[ "$name" == "Temporary Simulator Validation" && "$head_sha" == "$GITHUB_SHA" ]]; then
              continue
            fi
            if [[ "$status" == "queued" || "$status" == "in_progress" ]]; then
              echo "Cancelling $name run $run_id ($head_sha)"
              gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
            fi
          done
