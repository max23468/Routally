name: Finalize free core documentation

on:
  push:
    branches:
      - docs/free-core-plus-1x

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/free-core-plus-1x
          fetch-depth: 0

      - name: Allinea i checkpoint StoreKit e la baseline architetturale
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/MASTER_PLAN.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "protocol EntitlementProviding: Sendable { ... }\n",
                  "",
                  "protocollo entitlement nella baseline 1.0",
              ),
              (
                  "`Clock` e calendario devono essere controllabili nei test. Non si crea un protocollo per\n",
                  "Nella 1.0 non esiste un confine di entitlement. `EntitlementProviding` può essere introdotto\nsoltanto nella 1.X, dopo il checkpoint A di `DG-PLUS-LAUNCH`, se `TG-STOREKIT` dimostra\nche serve un confine testabile.\n\n`Clock` e calendario devono essere controllabili nei test. Non si crea un protocollo per\n",
                  "nota sul confine entitlement futuro",
              ),
              (
                  "- StoreKit config soltanto dopo `DG-PLUS-LAUNCH`, fuori dalla baseline 1.0.",
                  "- StoreKit config soltanto dopo il checkpoint A di `DG-PLUS-LAUNCH`; pubblicazione dopo il checkpoint B; fuori dalla baseline 1.0.",
                  "policy versioni StoreKit",
              ),
              (
                  "Gli eventuali prodotti StoreKit della 1.X richiedono anche `DG-PLUS-LAUNCH`.",
                  "La creazione non pubblica degli eventuali prodotti StoreKit della 1.X richiede il checkpoint A di `DG-PLUS-LAUNCH`; la pubblicazione richiede il checkpoint B.",
                  "ambienti StoreKit",
              ),
              (
                  "Eventuali prodotti StoreKit appartengono alla 1.X e richiedono anche `DG-PLUS-LAUNCH`.",
                  "Eventuali prodotti StoreKit appartengono alla 1.X: la creazione non pubblica richiede il checkpoint A di `DG-PLUS-LAUNCH` e la pubblicazione richiede il checkpoint B.",
                  "identità sviluppatore StoreKit",
              ),
              (
                  "StoreKit, ripristino, rimborso, revoca e Family Sharing entrano nei flussi obbligatori\nsoltanto nella release 1.X che chiude `DG-PLUS-LAUNCH`.",
                  "StoreKit, ripristino, rimborso, revoca e Family Sharing entrano nei flussi obbligatori\ndella release candidata Plus dopo il checkpoint A e devono essere completati prima del\ncheckpoint B di `DG-PLUS-LAUNCH`.",
                  "flussi test StoreKit",
              ),
              (
                  "Dalla 1.1: phased release di default. La beta commerciale di Plus viene pianificata\nseparatamente dopo `DG-PLUS-LAUNCH`.",
                  "Dalla 1.1: phased release di default. La beta commerciale e la Commerce QA di Plus\nvengono pianificate separatamente dopo il checkpoint A e prima del checkpoint B di\n`DG-PLUS-LAUNCH`.",
                  "beta Plus",
              ),
              (
                  "La checklist commerce completa viene aggiunta alla release 1.X che chiude\n`DG-PLUS-LAUNCH`; dovrà coprire prezzo una tantum, Family Sharing, restore,\nrefund/revoke, termini, privacy e trasparenza del perimetro Plus.",
                  "La checklist commerce completa viene aperta dopo il checkpoint A e deve essere\ncompletata prima del checkpoint B di `DG-PLUS-LAUNCH`; copre prezzo una tantum, Family\nSharing, restore, refund/revoke, termini, privacy e trasparenza del perimetro Plus.",
                  "checklist commerce",
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: attesa 1 occorrenza, trovate {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          node scripts/check-reading-matrix.mjs
          node scripts/check-roadmap-hierarchy.mjs
          git diff --check

      - name: Commit e rimuovi il workflow temporaneo
        shell: bash
        run: |
          git rm .github/workflows/finalize-free-core-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalizza i checkpoint del modello Plus"
          git push origin HEAD:docs/free-core-plus-1x
