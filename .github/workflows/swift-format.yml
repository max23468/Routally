name: Swift format

on:
  push:
    branches: [main]
    paths:
      - "**/*.swift"
      - "**/*.colorset/Contents.json"
      - ".swift-format"
      - "scripts/check-ui-assets.mjs"
  pull_request:
    branches: [main]
    paths:
      - "**/*.swift"
      - "**/*.colorset/Contents.json"
      - ".swift-format"
      - "scripts/check-ui-assets.mjs"

permissions:
  contents: read

jobs:
  lint:
    name: Lint Swift
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verifica formattazione
        run: >-
          swift format lint --recursive --strict
          RoutallyApp RoutallyTests Packages/RoutallyModules
      - name: Verifica asset UI Foundation
        run: node scripts/check-ui-assets.mjs
