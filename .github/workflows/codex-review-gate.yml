name: Codex review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Numero della PR da verificare
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: codex-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  invalidate:
    name: Invalida review precedente
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.event.action == 'synchronize' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Invalida il gate dell'HEAD precedente
        env:
          CODEX_REVIEW_MODE: invalidate
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/codex-review-gate.mjs

  gate:
    name: Aggiorna gate Codex
    needs: invalidate
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request_target' &&
        (github.event.action == 'opened' ||
         github.event.action == 'reopened' ||
         github.event.action == 'ready_for_review')) ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '@codex review' &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR')))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verifica il gate
        run: node --test scripts/codex-review-gate.test.mjs
      - name: Verifica la gerarchia della roadmap
        run: node scripts/check-roadmap-hierarchy.mjs
      - name: Attendi la review Codex
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
        run: node scripts/codex-review-gate.mjs
