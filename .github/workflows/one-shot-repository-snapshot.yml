name: One-shot icon validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'codex/icon-validation-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply canonical documentation updates
        run: node scripts/apply-icon-review-updates-once.mjs

      - name: Regenerate and validate icon assets
        run: |
          node scripts/build-icon-assets.mjs
          node scripts/check-icon-assets.mjs
          node scripts/build-icon-review-assets.mjs
          node scripts/validate-icon-assets.mjs
          node scripts/check-reading-matrix.mjs
          node scripts/check-roadmap-hierarchy.mjs
          git diff --check

      - name: Materialize generated review assets
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/MASTER_PLAN.md \
            docs/DECISION_REGISTER.md \
            docs/DESIGN/ui-foundation.md \
            docs/DESIGN/icon/composer-layers \
            docs/DESIGN/icon/experiments \
            docs/DESIGN/icon/evidence \
            scripts/validate-icon-assets.mjs
          if git diff --cached --quiet; then
            echo "Nessuna modifica da materializzare."
            exit 0
          fi
          git commit -m "design: materialize icon validation assets"
          git push origin "HEAD:${BRANCH}"
